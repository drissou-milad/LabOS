<svg viewBox="0 0 560 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b79"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="560" height="1000" fill="#ffffff"/>

  <!-- 1. Dataset -->
  <rect x="130" y="20" width="300" height="60" rx="10" fill="#eef2f7" stroke="#8aa0b3" stroke-width="1.5"/>
  <text x="280" y="46" text-anchor="middle" font-size="16" font-weight="600" fill="#22303c">Dataset</text>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#5b6b79">Zarr volumes (T, Z, Y, X) · src/dataset.py</text>

  <line x1="280" y1="80" x2="280" y2="118" stroke="#5b6b79" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2. Volume loader -->
  <rect x="130" y="120" width="300" height="60" rx="10" fill="#eef2f7" stroke="#8aa0b3" stroke-width="1.5"/>
  <text x="280" y="146" text-anchor="middle" font-size="16" font-weight="600" fill="#22303c">Volume Loader</text>
  <text x="280" y="166" text-anchor="middle" font-size="12" fill="#5b6b79">BioHubDataset.load_volume()</text>

  <line x1="280" y1="180" x2="280" y2="218" stroke="#5b6b79" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3. Max projection -->
  <rect x="130" y="220" width="300" height="60" rx="10" fill="#eef2f7" stroke="#8aa0b3" stroke-width="1.5"/>
  <text x="280" y="246" text-anchor="middle" font-size="16" font-weight="600" fill="#22303c">Maximum Projection</text>
  <text x="280" y="266" text-anchor="middle" font-size="12" fill="#5b6b79">frame.max(axis=0), per timepoint</text>

  <line x1="280" y1="280" x2="280" y2="318" stroke="#5b6b79" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 4. Detector -->
  <rect x="110" y="320" width="340" height="70" rx="10" fill="#e6efe9" stroke="#6fa389" stroke-width="1.5"/>
  <text x="280" y="349" text-anchor="middle" font-size="16" font-weight="600" fill="#1e3d2f">Detector</text>
  <text x="280" y="369" text-anchor="middle" font-size="12" fill="#3f5e4e">Gaussian smoothing + peak_local_max · src/detector.py</text>
  <text x="280" y="384" text-anchor="middle" font-size="11" fill="#6b8578">→ candidate cell centers (noisy)</text>

  <line x1="280" y1="390" x2="280" y2="428" stroke="#5b6b79" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 5. CNN -->
  <rect x="110" y="430" width="340" height="70" rx="10" fill="#e9edf9" stroke="#7c8fd6" stroke-width="1.5"/>
  <text x="280" y="459" text-anchor="middle" font-size="16" font-weight="600" fill="#242c5c">CellCNN</text>
  <text x="280" y="479" text-anchor="middle" font-size="12" fill="#3a4585">Patch classifier · src/model.py, src/predict.py</text>
  <text x="280" y="494" text-anchor="middle" font-size="11" fill="#5c68a8">→ keep / reject each candidate</text>

  <line x1="280" y1="500" x2="280" y2="538" stroke="#5b6b79" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 6. Accepted centers -->
  <rect x="130" y="540" width="300" height="55" rx="10" fill="#eef2f7" stroke="#8aa0b3" stroke-width="1.5"/>
  <text x="280" y="563" text-anchor="middle" font-size="15" font-weight="600" fill="#22303c">Accepted Cell Centers</text>
  <text x="280" y="581" text-anchor="middle" font-size="12" fill="#5b6b79">per frame</text>

  <line x1="280" y1="595" x2="280" y2="633" stroke="#5b6b79" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 7. Hungarian tracker -->
  <rect x="110" y="635" width="340" height="70" rx="10" fill="#faf1e3" stroke="#d3a24f" stroke-width="1.5"/>
  <text x="280" y="664" text-anchor="middle" font-size="16" font-weight="600" fill="#5c4413">Hungarian Tracker</text>
  <text x="280" y="684" text-anchor="middle" font-size="12" fill="#7a5c1f">Optimal frame-to-frame assignment · src/tracker.py</text>
  <text x="280" y="699" text-anchor="middle" font-size="11" fill="#93762f">→ consistent track IDs across time</text>

  <line x1="280" y1="705" x2="280" y2="743" stroke="#5b6b79" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 8. submission.csv -->
  <rect x="130" y="745" width="300" height="60" rx="10" fill="#f8eaea" stroke="#c97a7a" stroke-width="1.5"/>
  <text x="280" y="771" text-anchor="middle" font-size="16" font-weight="600" fill="#5c1f1f">submission.csv</text>
  <text x="280" y="791" text-anchor="middle" font-size="12" fill="#8a3c3c">outputs/submission.csv · Kaggle-ready</text>

  <!-- side legend -->
  <rect x="30" y="860" width="14" height="14" rx="3" fill="#eef2f7" stroke="#8aa0b3"/>
  <text x="52" y="871" font-size="12" fill="#3a4552">data / I-O stage</text>

  <rect x="30" y="888" width="14" height="14" rx="3" fill="#e6efe9" stroke="#6fa389"/>
  <text x="52" y="899" font-size="12" fill="#3a4552">classical CV (detector)</text>

  <rect x="30" y="916" width="14" height="14" rx="3" fill="#e9edf9" stroke="#7c8fd6"/>
  <text x="52" y="927" font-size="12" fill="#3a4552">learned model (PyTorch)</text>

  <rect x="30" y="944" width="14" height="14" rx="3" fill="#faf1e3" stroke="#d3a24f"/>
  <text x="52" y="955" font-size="12" fill="#3a4552">optimization (Hungarian assignment)</text>
</svg>
